services:
  danirai:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - danirai-data:/srv/danirai/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-please}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-duckduckgo}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - PAYMENT_SECRET=${PAYMENT_SECRET:-dev-payment-secret}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  danirai-data:
